[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spkclone"
version = "0.1.0"
description = "Can zero-shot TTS voice clones fool an ECAPA-TDNN speaker verifier? Evaluation pipeline with SpeechBrain."
requires-python = ">=3.10"
readme = "README.md"
# licence: not chosen yet (repository owner's decision)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs SpeechBrain + internet (pretrained model download); run on Kaggle"]
